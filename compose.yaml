services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odonto}
      POSTGRES_USER: ${POSTGRES_USER:-odonto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/configure.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-odonto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-odonto}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_media:/app/private_media
      - backups:/app/backups
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
volumes:
  postgres_data:
  private_media:
  backups:
