<form class="filters panel" method="get"><label>De<input type="date" class="form-control" name="from" value="{{ start|date:'Y-m-d' }}"></label><label>Até<input type="date" class="form-control" name="to" value="{{ end|date:'Y-m-d' }}"></label><label>Unidade<select name="branch" class="form-select"><option value="">Todas</option>{% for b in branches %}<option value="{{ b.pk }}" {% if request.GET.branch == b.pk|stringformat:'s' %}selected{% endif %}>{{ b }}</option>{% endfor %}</select></label><label>Dentista<select name="professional" class="form-select"><option value="">Todos</option>{% for p in professionals %}<option value="{{ p.pk }}" {% if request.GET.professional == p.pk|stringformat:'s' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label><label>Procedimento<select name="procedure" class="form-select"><option value="">Todos</option>{% for p in procedures %}<option value="{{ p.pk }}" {% if request.GET.procedure == p.pk|stringformat:'s' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label>{% if reports %}<label>Relatório<select name="report" class="form-select">{% for k,v in reports.items %}<option value="{{ k }}" {% if k == selected %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></label>{% endif %}<button class="btn btn-primary">Aplicar</button></form>
