{% extends 'base.html' %}{% block content %}<section class="panel form-panel"><p class="text-muted">{{ hint }}</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.non_field_errors }}<div class="form-grid">{% for field in form %}<div class="field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<small class="text-muted">{{ field.help_text|safe }}</small>{% endif %}</div>{% endfor %}</div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Salvar</button><a class="btn btn-outline-secondary" href="{{ back|default:'/' }}">Voltar</a></div></form></section>{% endblock %}
